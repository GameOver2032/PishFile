# --- تنظیمات Gradle برای پروژه پیش‌فایل ---
# روی ماشین‌های با حافظه‌ی کم (CI و کانتینر) این اعداد امن هستند؛
# اگر سیستم شما ۱۶ گیگابایت یا بیشتر رم دارد می‌توانید Xmx را به 4g افزایش دهید.
org.gradle.jvmargs=-Xmx1440m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.daemon=false

# کامپایل کاتلین داخل همان پروسه‌ی Gradle (جلوگیری از ساخت JVM دوم و مصرف حافظه‌ی کمتر)
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
